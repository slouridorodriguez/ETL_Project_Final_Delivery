# Proyecto ETL (G51): Airflow + Postgres + Kafka + modelo + dashboard + reporte.
#
#   docker compose up --build
#
# Antes de levantar: copiar los datos a ./data (ver data/README.md) y el modelo a ./models.
# Direcciones: Airflow http://localhost:8080 | dashboard http://localhost:8501 | reporte http://localhost:8000/reporte_estatico.html

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://etl:etl@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  AIRFLOW__WEBSERVER__SECRET_KEY: etl-g51-clave-local
  # el dag
  ETL_BASE: /opt/airflow/salidas
  ETL_STAGING: /opt/airflow/staging
  CSV_PATH: /opt/airflow/data/viviendas_pdtos.csv
  DATABASE_URL: sqlite:////opt/airflow/origen/origen_db.db
  DESTINO_URL: postgresql://etl:etl@postgres:5432/warehouse
  API_URL: ${API_URL:-http://201.32.130.152/api/productos}
  DAG_SCHEDULE: "@once"          # corre una vez al arrancar; después se lanza a mano desde la interfaz

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./scripts:/opt/airflow/scripts:ro
  - ./data:/opt/airflow/data:ro
  - airflow_origen:/opt/airflow/origen
  - airflow_salidas:/opt/airflow/salidas
  - airflow_staging:/opt/airflow/staging
  - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-airflow.sql:/docker-entrypoint-initdb.d/init-airflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build: ./airflow
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create -u "${AIRFLOW_ADMIN_USER:-admin}" -p "${AIRFLOW_ADMIN_PASSWORD:-admin}" -f Admin -l ETL -r Admin -e admin@example.com || true
        python /opt/airflow/scripts/seed_origen.py
    restart: "no"

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  warehouse-init:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: warehouse-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DESTINO_URL: postgresql://etl:etl@postgres:5432/warehouse
    volumes:
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro
    command: ["python", "scripts/preparar_warehouse.py"]
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # lee los hogares de prueba de vw_dataset_prediccion + split_modelo y los publica uno a uno.
  # espera a que el dag de Airflow haya cargado la vista.
  producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP_DOCKER:-kafka:9092}
      TOPIC_FEATURES: ${TOPIC_FEATURES:-hogares_entrena_modelo}
      DELAY_SEG: ${DELAY_SEG:-1}
      MAX_MENSAJES: ${MAX_MENSAJES:-0}
      CICLOS: ${CICLOS:-0}
      CREAR_TOPIC: ${CREAR_TOPIC:-1}
      DESTINO_URL: ${DESTINO_URL-postgresql://etl:etl@postgres:5432/warehouse}
      ESPERAR_VISTA: ${ESPERAR_VISTA:-1}
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["sh", "-c", "[ \"$$ESPERAR_VISTA\" = 0 ] || python scripts/esperar_vista.py; python streaming/producer.py"]
    restart: unless-stopped

  # carga el modelo una vez, predice cada mensaje, publica la predicción y la guarda en predicciones_hogar
  consumer:
    build:
      context: .
      dockerfile: streaming/Dockerfile.consumer
      args:
        SKLEARN_VERSION: ${SKLEARN_VERSION:-}
    container_name: consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP_DOCKER:-kafka:9092}
      TOPIC_FEATURES: ${TOPIC_FEATURES:-hogares_entrena_modelo}
      TOPIC_PREDICCIONES: ${TOPIC_PREDICCIONES:-hogares_etl_resultado}
      TOPIC_INVALIDOS: ${TOPIC_INVALIDOS-hogares_invalidos}
      RUTA_MODELO: /app/models/modelo_pobreza.joblib
      RUTA_META: /app/models/modelo_pobreza_meta.json
      DESTINO_URL: ${DESTINO_URL-postgresql://etl:etl@postgres:5432/warehouse}
      GUARDAR_PREDICCIONES: ${GUARDAR_PREDICCIONES:-1}
      CREAR_TOPIC: ${CREAR_TOPIC:-1}
      OFFSET_RESET: ${OFFSET_RESET:-earliest}
      GROUP_ID: ${GROUP_ID:-etl-g51-consumer-modelo}
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  # dashboard en vivo: otro consumer de Kafka sobre el topic de predicciones
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP_DOCKER:-kafka:9092}
      TOPIC_PREDICCIONES: ${TOPIC_PREDICCIONES:-hogares_etl_resultado}
      CREAR_TOPIC: ${CREAR_TOPIC:-1}
      RUTA_META: /app/models/modelo_pobreza_meta.json
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8501:8501"
    restart: unless-stopped

  # reporte estático: consultas SQL al warehouse una vez que el dag cargó las tablas
  reporte:
    build:
      context: .
      dockerfile: reportes/Dockerfile
    container_name: reporte
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DESTINO_URL: postgresql://etl:etl@postgres:5432/warehouse
    volumes:
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    command: ["sh", "-c", "python scripts/esperar_vista.py && python reportes/reporte_estatico.py --salida /app/reports && cd /app/reports && python -m http.server 8000"]
    ports:
      - "8000:8000"
    restart: "no"

volumes:
  pgdata:
  airflow_origen:
  airflow_salidas:
  airflow_staging:
  airflow_logs:
